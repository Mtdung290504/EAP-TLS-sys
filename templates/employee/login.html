<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Employee Portal — Đăng nhập</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				font-size: 14px;
				background: #f5f5f5;
				color: #111;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
			}
			.card {
				background: #fff;
				border: 1px solid #ddd;
				border-radius: 4px;
				width: 380px;
				padding: 36px 28px;
				text-align: center;
			}
			h1 {
				font-size: 18px;
				font-weight: 600;
				margin-bottom: 4px;
			}
			.subtitle {
				color: #666;
				font-size: 13px;
				margin-bottom: 28px;
			}
			.error-box {
				background: #fef2f2;
				border: 1px solid #fca5a5;
				color: #b91c1c;
				padding: 10px 14px;
				border-radius: 3px;
				margin-bottom: 20px;
				font-size: 13px;
				text-align: left;
			}
			.btn-google {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				width: 100%;
				padding: 10px 16px;
				background: #fff;
				border: 1px solid #ccc;
				border-radius: 3px;
				font-size: 14px;
				color: #333;
				text-decoration: none;
				cursor: pointer;
			}
			.btn-google:hover {
				background: #f5f5f5;
				border-color: #999;
			}
			.google-icon {
				width: 18px;
				height: 18px;
			}
			.note {
				font-size: 12px;
				color: #999;
				margin-top: 16px;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Employee Portal</h1>
			<p class="subtitle">Quản lý chứng chỉ EAP-TLS của bạn</p>

			{% if error %}
			<div class="error-box">{{ error }}</div>
			{% endif %}

			<a href="{{ url_for('auth_google') }}" class="btn-google">
				<svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path
						d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
						fill="#4285F4"
					/>
					<path
						d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
						fill="#34A853"
					/>
					<path
						d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
						fill="#FBBC05"
					/>
					<path
						d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
						fill="#EA4335"
					/>
				</svg>
				Đăng nhập với Google
			</a>
			<p class="note">Chỉ tài khoản công ty được đăng ký mới có thể đăng nhập.</p>
		</div>
	</body>
</html>
